- name: 1.1 套用 Calico YAML 設定
  ansible.builtin.shell: kubectl apply -f calico.yaml
  args:
    chdir: /nfsshare01/lsrc/{{ customer_name }}/k8s_yaml
  register: apply_calico
  changed_when: "'created' in apply_calico.stdout or 'configured' in apply_calico.stdout"

- name: 1.2 等待 120 秒讓 Calico 服務啟動
  ansible.builtin.pause:
    seconds: 120

- name: 1.3 驗證 Calico 服務 Pod 狀態
  ansible.builtin.shell: kubectl -n kube-system get pods | grep calico
  register: calico_pods_status
  changed_when: false

- name: 1.4 顯示 Calico 驗證結果
  ansible.builtin.debug:
    msg: "{{ calico_pods_status.stdout_lines }}"