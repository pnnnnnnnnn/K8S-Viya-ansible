- name: 1.1 安裝 NFS 服務套件
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

- name: 1.2 啟動並啟用 NFS 服務
  ansible.builtin.systemd:
    name: nfs-server
    state: started
    enabled: true

- name: 1.3 建立 NFS 共用與掛載目錄
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /nfsshare01/repos
    - /nfsshare01/sas_pv
    - /nfsshare01/sas_compute
    - /nfsshare01/sas_data_access
    - /nfsshare01/sas_open_source

- name: 2.1 設定 NFS Server 目錄與權限
  ansible.builtin.template:
    src: network.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  
- name: 3. 運行 NFS Server
  ansible.builtin.systemd:
    name: nfs-server
    state: started
    enabled: true

- name: 4. 移除舊版本的 Docker 相關套件
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
    state: absent

- name: 5. 安裝 yum-utils 前置套件
  ansible.builtin.dnf:
    name: yum-utils
    state: present

- name: 6. 配置 docker-ce 與 k8s 本地 yum repo
  ansible.builtin.template:
    src: local_repo.j2
    dest: /etc/yum.repos.d/local.repo
    owner: root
    group: root
    mode: "0644"

- name: 7. 複製 k8s 安裝包
  ansible.builtin.shell: |
    cp -rfv "/nfsshare01/lsrc/{{ customer_name }}/k8s_1.33.9" "/nfsshare01/lsrc/{{ customer_name }}/docker" "/nfsshare01/lsrc/{{ customer_name }}/k8s_1.33.9.tgz" "/nfsshare01/repos/"

- name: 8. 批次安裝 /nfsshare01/repos/docker 目錄下的 RPM
  ansible.builtin.shell: dnf install -y /nfsshare01/repos/docker/*.rpm

- name: 9. 啟動並設定 Docker 開機自動啟動
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: 10. 設定 Docker daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"

- name: 11. 重啟 Docker 服務
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: 12.1 解壓縮 Harbor 離線安裝包
  ansible.builtin.unarchive:
    src: "/nfsshare01/harbor-offline-installer-v2.15.2.tgz"
    dest: "/nfsshare01/"
    remote_src: yes

- name: 12.2 建立 Harbor 憑證目錄
  ansible.builtin.file:
    path: "/nfsshare01/harbor/cert"
    state: directory
    mode: "0755"

- name: 12.3 部署 OpenSSL 設定檔模板
  ansible.builtin.template:
    src: openssl.cnf.j2
    dest: "/nfsshare01/harbor/cert/openssl.cnf"
    owner: root
    group: root
    mode: "0644"

- name: 12.4 產生 Harbor 自簽憑證與私鑰
  ansible.builtin.command:
    cmd: openssl req -x509 -nodes -days 3650 -newkey rsa:4096 -keyout ./harbor.key -out ./harbor.crt -config openssl.cnf
    chdir: "/nfsshare01/harbor/cert"
    creates: "/nfsshare01/harbor/cert/harbor.crt"

- name: 12.5 讀取並檢視自簽憑證資訊
  ansible.builtin.command:
    cmd: openssl x509 -text -noout -in ./harbor.crt
    chdir: "/nfsshare01/harbor/cert"
  register: cert_result
  changed_when: false

- name: 12.6 顯示憑證詳細內容
  ansible.builtin.debug:
    var: cert_result.stdout_lines

- name: 12.7 複製 harbor.yml 範本
  ansible.builtin.copy:
    src: "/nfsshare01/harbor/harbor.yml.tmpl"
    dest: "/nfsshare01/harbor/harbor.yml"
    remote_src: yes
    force: yes

- name: 12.8 設定 harbor.yml 的 hostname
  ansible.builtin.lineinfile:
    path: "/nfsshare01/harbor/harbor.yml"
    regexp: '^(\s*hostname\s*:\s*).*'
    line: "hostname: {{ registry_ip }}"
    backrefs: yes

- name: 12.9 設定 harbor.yml 的 certificate 憑證路徑
  ansible.builtin.lineinfile:
    path: "/nfsshare01/harbor/harbor.yml"
    regexp: '^\s*certificate\s*:'
    line: "  certificate: /nfsshare01/harbor/cert/harbor.crt"

- name: 12.10 設定 harbor.yml 的 private_key 私鑰路徑
  ansible.builtin.lineinfile:
    path: "/nfsshare01/harbor/harbor.yml"
    regexp: '^\s*private_key\s*:'
    line: "  private_key: /nfsshare01/harbor/cert/harbor.key"

- name: 12.11 載入 Harbor Docker 映像檔
  ansible.builtin.command:
    cmd: docker load -i harbor.v2.15.2.tar.gz
    chdir: "/nfsshare01/harbor"
  register: docker_load_result
  changed_when: "'Loaded image' in docker_load_result.stdout"

- name: 12.12 執行 Harbor 準備設定檔 (prepare)
  ansible.builtin.command:
    cmd: ./prepare
    chdir: "/nfsshare01/harbor"
  changed_when: true

- name: 12.12.5 確保執行安裝前 Docker 服務健康且無鎖死
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: yes

- name: 12.12.6 清理可能卡住的舊 Harbor 容器
  ansible.builtin.shell: |
    docker ps -a | grep harbor | awk '{print $1}' | xargs -r docker rm -f || true
  args:
    chdir: "/nfsshare01/harbor"
  changed_when: true

- name: 12.13 執行 Harbor 安裝程式 (install.sh)
  ansible.builtin.command:
    cmd: ./install.sh
    chdir: "/nfsshare01/harbor"
  changed_when: true

- name: 13. 尋找 K8s 本地目錄下的所有 RPM 檔案
  ansible.builtin.find:
    paths: "/nfsshare01/repos/k8s_1.33.9"
    patterns: "*.rpm"
  register: k8s_rpms

- name: 13.1 批次安裝 K8s 相關元件 RPM
  ansible.builtin.dnf:
    name: "{{ k8s_rpms.files | map(attribute='path') | list }}"
    state: present
    disable_gpg_check: yes

- name: 14.1 建立 Docker 憑證存放目錄
  ansible.builtin.file:
    path: "/etc/docker/certs.d/{{ registry_ip }}"
    state: directory
    mode: "0755"

- name: 14.2 複製 Harbor 自簽憑證至 Docker 憑證目錄
  ansible.builtin.copy:
    src: "/nfsshare01/harbor/cert/harbor.crt"
    dest: "/etc/docker/certs.d/{{ registry_ip }}/ca.crt"
    remote_src: yes
